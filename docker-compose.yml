# =============================================================================
# Docker Compose — Credit Card Fraud Detection
# =============================================================================
# Run: docker-compose up -d
# Stop: docker-compose down

version: "3.8"

services:
  # ---------------------------------------------------------------------------
  # FastAPI Backend
  # ---------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fraud-api
    ports:
      - "8000:8000"
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - LOG_LEVEL=INFO
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    volumes:
      - ./models:/app/models
      - ./logs:/app/logs
      - ./outputs:/app/outputs
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --workers 2
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Streamlit Frontend
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fraud-frontend
    ports:
      - "8501:8501"
    environment:
      - FRONTEND_API_URL=http://api:8000
      - LOG_LEVEL=INFO
    volumes:
      - ./models:/app/models
      - ./outputs:/app/outputs
    command: streamlit run app.py --server.port 8501 --server.headless true --server.address 0.0.0.0
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # MLflow Tracking Server
  # ---------------------------------------------------------------------------
  mlflow:
    image: python:3.11-slim
    container_name: fraud-mlflow
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlruns
    command: >
      bash -c "pip install mlflow --quiet &&
      mlflow server --host 0.0.0.0 --port 5000 --backend-store-uri /mlruns --default-artifact-root /mlruns"
    restart: unless-stopped

volumes:
  models:
  logs:
  outputs:
  mlruns:
